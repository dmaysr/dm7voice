name: Build DM7 Voice

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  release:
    # Every passing build on main publishes v<version> from CMakeLists.txt, with the three
    # zips, and removes older releases so only the latest is kept (same as Audio All Station).
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 -oP 'project\(DM7Voice VERSION \K[0-9.]+' CMakeLists.txt)
          tag="v$version"
          for f in out/DM7Voice-*.zip; do
            base=$(basename "$f" .zip)
            mv "$f" "out/${base/DM7Voice-/DM7Voice-$version-}.zip"
          done
          ls -la out
          notes="SM7B-style dynamic broadcast mic tone plugin. Windows: VST3 + standalone. macOS: VST3, AU + app (universal, unsigned; see README to open). Linux: VST3 + standalone. Install steps are in README.md inside each zip."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" out/*.zip --clobber
            gh release edit "$tag" --draft=false --latest
          else
            gh release create "$tag" out/*.zip --title "DM7 Voice $tag" --notes "$notes" --target "$GITHUB_SHA" --latest
          fi

          # Keep only the latest version: remove older releases and their tags.
          for old in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q ".[] | select(.tag_name != \"$tag\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$old"
          done
          for old in $(git ls-remote --tags origin | sed -n 's#.*refs/tags/\([^^]*\)$#\1#p'); do
            if [ "$old" != "$tag" ]; then git push origin ":refs/tags/$old" || true; fi
          done
